<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Kanri : crée tes boutiques, note tes ventes et tes dépenses, prévois tes commandes.">
<meta name="theme-color" content="#6F050D">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>Kanri</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: "the stack" — shops, figures and AI advice arrive as cards that drop onto a pile one at a time.
   Hero = headline + shop stack; below, the register. Card colours are tokens --k1..--k4: swap them to recolour the site. */
:root{
  --bg:#FBF7F2; --surface:#FFFDF9; --sunk:#F1E8DF; --ink:#2B0A0C; --muted:#73605A; --line:#E6D9CD;
  --accent:#6F050D; --accent-soft:#F4E3DF;
  --k1:#6F050D; --k1b:#4E0309; --k1-ink:#F7EDC4;
  --k2:#96A6C9; --k2b:#8496BC; --k2-ink:#4A0308;
  --k3:#F7EDC4; --k3b:#EFE1A8; --k3-ink:#6F050D;
  --k4:#EBDFD5; --k4b:#E0CFC1; --k4-ink:#6F050D;
  --exp:#96A6C9; --pos:#3C6E4E; --neg:#A3241B; --neg-soft:#F6E0DA; --neg-line:#D98B78;
  --blob-o:.35;
  --f-display:"Cormorant Garamond","Didot","Bodoni MT",Georgia,serif;
  --f-body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Montserrat",system-ui,sans-serif;
  --ease-drop:cubic-bezier(.2,.9,.25,1.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A0A0B; --surface:#251211; --sunk:#311a17; --ink:#F5ECE2; --muted:#BFA9A0; --line:#432722;
  --accent:#B3C1DE; --accent-soft:#2C2A38;
  --k1:#8A0A14; --k1b:#5E050C;
  --exp:#96A6C9; --pos:#7FC198; --neg:#F0917C; --neg-soft:#3A1D19; --neg-line:#9C4B3B;
  --blob-o:.22; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1A0A0B; --surface:#251211; --sunk:#311a17; --ink:#F5ECE2; --muted:#BFA9A0; --line:#432722;
  --accent:#B3C1DE; --accent-soft:#2C2A38;
  --k1:#8A0A14; --k1b:#5E050C;
  --exp:#96A6C9; --pos:#7FC198; --neg:#F0917C; --neg-soft:#3A1D19; --neg-line:#9C4B3B;
  --blob-o:.22; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:var(--blob-o)}
.bgfx i:nth-child(1){background:var(--k3);top:-25vmax;left:-20vmax;animation:drift1 24s ease-in-out infinite alternate}
.bgfx i:nth-child(2){background:var(--k1);bottom:-30vmax;right:-20vmax;animation:drift2 28s ease-in-out infinite alternate}
.bgfx i:nth-child(3){background:var(--k2);top:30%;left:40%;width:35vmax;height:35vmax;animation:drift1 32s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vmax,-12vmax) scale(.9)}}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h3{font-size:1.05rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.8}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:44px;display:block}
.mark .kanri{width:100%;height:100%}
.brand:hover .k-arm-r{animation:k-wave .5s ease-in-out 2}

/* Kanri, the mascot: a round dumpling spirit with a leaf sprout, holding a coin */
.kanri{display:block;overflow:visible}
.kanri *{transform-box:view-box}
.kanri .k-body{transform-origin:100px 205px;animation:k-breathe 3.4s ease-in-out infinite}
.kanri .k-sprout{transform-origin:101px 48px;animation:k-sway 2.8s ease-in-out infinite alternate}
.kanri .k-eyes{transform-origin:100px 104px;animation:k-blink 5s ease-in-out infinite}
.kanri .k-arm-r{transform-origin:128px 156px}
.kanri.wave .k-arm-r,.home-art:hover .k-arm-r{animation:k-wave .55s ease-in-out 3}
.kanri.jump{animation:k-jump 1s cubic-bezier(.3,1.6,.5,1) .15s both}
.kanri.think .k-coin{transform-origin:100px 160px;animation:k-flip 1.3s ease-in-out infinite}
.kanri.think .k-eyes{animation:k-look 2.6s ease-in-out infinite}
@keyframes k-breathe{50%{transform:scale(1.025,.975)}}
@keyframes k-sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes k-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes k-wave{50%{transform:rotate(-28deg) translate(4px,-6px)}}
@keyframes k-jump{0%{opacity:0;transform:translateY(60px) scale(.6,.4)}45%{opacity:1;transform:translateY(-26px) scale(.92,1.1)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes k-flip{50%{transform:scaleX(.15)}}
@keyframes k-look{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}65%{transform:translateX(5px)}}
.veil-m{width:clamp(90px,16vw,150px);margin-bottom:6px}
.veil.a{grid-auto-flow:row;align-content:center;justify-items:center}
.brand b{font-family:var(--f-display);font-size:1.55rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.brand b em{font-style:italic;text-transform:none;letter-spacing:0;font-weight:500}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;font-weight:600}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
.mode{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
#currency{width:auto;background:var(--surface)}

/* tabs: "inflating text" — letters swell one after another; a morphing blob slides under the active tab */
.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;overflow-y:hidden;padding:10px 4px 14px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{all:unset;position:relative;z-index:1;cursor:pointer;flex:none;padding:10px 20px 12px;font-family:var(--f-display);font-size:1.45rem;font-weight:400;line-height:1;color:var(--ink);transition:color .35s}
.tab .ch{display:inline-block;transform-origin:50% 75%;transition:transform .55s cubic-bezier(.3,1.7,.45,1),font-weight .5s ease;transition-delay:calc(var(--i) * 28ms)}
.tab:hover .ch{transform:scale(1.16,1.24) translateY(-1px);font-weight:700}
.tab[aria-current="true"]{color:var(--k1-ink)}
.tab[aria-current="true"] .ch{font-weight:700;font-style:italic;transform:scale(1.06)}
.tab.add{color:var(--muted)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:99px}
.tab-blob{position:absolute;left:0;top:0;z-index:0;background:var(--k1);border-radius:999px;opacity:0;
  transition:transform .65s cubic-bezier(.65,0,.25,1.15),width .65s cubic-bezier(.65,0,.25,1.15),opacity .3s;animation:blobby 6s ease-in-out infinite}
@keyframes blobby{0%,100%{border-radius:999px}33%{border-radius:46% 54% 60% 40% / 62% 48% 52% 38%}66%{border-radius:58% 42% 44% 56% / 44% 60% 40% 56%}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* page transition veil: zoom-mask in, curved curtain out */
.veil{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none}
.veil.b{background:var(--k2);z-index:99}
.veil.a{background:var(--k1);color:var(--k1-ink)}
.veil-txt{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(2.6rem,9vw,6.5rem);line-height:1;padding:0 16px;text-align:center;overflow-wrap:anywhere}
.veil-txt .ch{display:inline-block;animation:swell .9s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i) * 32ms + 260ms)}
@keyframes swell{0%{opacity:0;transform:scale(.3,.2);font-weight:300}55%{opacity:1;transform:scale(1.18,1.3);font-weight:700}100%{transform:scale(1);font-weight:500}}
#main.hold *{animation-play-state:paused!important}

/* ---------- full-screen sections: colour wipes in, giant number slides, words rise out of masks ---------- */
#main.paged{gap:0}
.sec{position:relative;width:100vw;margin-left:calc(50% - 50vw);min-height:100svh;display:flex;align-items:center;padding-block:84px;isolation:isolate;overflow:clip;scroll-snap-align:start;color:var(--ink)}
.sec.first{min-height:calc(100svh - 150px);padding-block:20px 60px}
.sec::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--bg);clip-path:inset(100% 0 0 0);transition:clip-path 1.15s cubic-bezier(.76,0,.24,1)}
.sec.first::before,.sec:not(.s-red):not(.s-light):not(.s-blue)::before{background:transparent}
.sec.in::before{clip-path:inset(0)}
.sec-in{position:relative;width:100%;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px;min-width:0}
.sec-num{font-family:var(--f-body);font-weight:800;font-size:.8rem;letter-spacing:.22em;display:flex;align-items:center;gap:12px;color:var(--ink)}
.sec-num span{color:var(--muted)}
.sec-num::after{content:"";height:2px;width:0;background:currentColor;transition:width 1.2s cubic-bezier(.16,1,.3,1) .5s}
.sec.in .sec-num::after{width:72px}
.sec-big{position:absolute;right:-1vw;top:2vh;z-index:-1;font-family:var(--f-body);font-weight:900;font-size:clamp(9rem,30vw,26rem);line-height:.8;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px var(--line);
  transform:translateX(30%);opacity:0;transition:transform 1.6s cubic-bezier(.16,1,.3,1) .2s,opacity 1s .2s;pointer-events:none}
.sec.in .sec-big{transform:none;opacity:1}
.statement{font-family:var(--f-body);font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,9vw,7.4rem);line-height:.9;letter-spacing:-.035em;margin:0;color:var(--ink);text-wrap:balance}
.statement.sm{font-size:clamp(2.2rem,6.4vw,5rem)}
.statement em{font-family:var(--f-display);font-style:italic;font-weight:500;text-transform:none;letter-spacing:-.01em;color:var(--hl,var(--accent))}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .02em .08em}
.w>span{display:inline-block;transform:translateY(112%) rotate(7deg);transform-origin:0 100%;transition:transform 1.05s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i) * 80ms + .35s)}
.sec.in .w>span{transform:none}
.sec .rv{opacity:0;transform:translateY(60px);transition:opacity .9s ease,transform 1.15s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,.2s)}
.sec.in .rv{opacity:1;transform:none}
.sec-mascot{position:absolute;right:max(16px,3vw);bottom:-30px;width:110px;z-index:1;transform:translateY(-130vh) rotate(-35deg);transition:transform 1.5s cubic-bezier(.3,1.35,.5,1) .9s;pointer-events:none}
.sec.in .sec-mascot{transform:rotate(6deg)}
@media (max-width:760px){.sec-mascot{display:none}.sec{min-height:auto;padding-block:64px}}

/* section palettes (fixed in both themes): red = sales, cream = advice */
.s-red{--bg:#6F050D;--surface:rgba(255,246,222,.07);--sunk:rgba(255,246,222,.12);--ink:#F7EDC4;--muted:#E5C6B6;--line:rgba(247,237,196,.22);
  --accent:#F7EDC4;--accent-soft:rgba(247,237,196,.16);--hl:#B3C1DE;--k1:#F7EDC4;--k1b:#E9DCA6;--k1-ink:#6F050D;--exp:#96A6C9;--pos:#BFE6CB;--neg:#FFB7A6;color-scheme:dark}
.s-light{--bg:#F7EDC4;--surface:#FFFBEB;--sunk:#EFE2B3;--ink:#2B0A0C;--muted:#6B5639;--line:#E2D29A;--accent:#6F050D;--accent-soft:#F1DCCB;--hl:#6F050D;
  --k1:#6F050D;--k1b:#4E0309;--k1-ink:#F7EDC4;--k2:#96A6C9;--k2b:#8496BC;--k2-ink:#4A0308;--k3:#FFFDF5;--k3b:#F6EED6;--k3-ink:#6F050D;--k4:#EBDFD5;--k4b:#E0CFC1;--k4-ink:#6F050D;--pos:#2F6B47;--neg:#A3241B;color-scheme:light}
.s-blue{--bg:#96A6C9;--surface:rgba(255,255,255,.32);--sunk:rgba(255,255,255,.42);--ink:#1F0507;--muted:#3A2A38;--line:rgba(31,5,7,.18);
  --accent:#6F050D;--accent-soft:rgba(111,5,13,.12);--hl:#6F050D;--k1:#6F050D;--k1b:#4E0309;--k1-ink:#F7EDC4;--pos:#1F5A3A;--neg:#7A0E10;color-scheme:light}
.s-blue input,.s-blue select{background:rgba(255,255,255,.55);border-color:rgba(31,5,7,.2)}
.s-blue .msg.a{background:rgba(255,255,255,.6)}
.start-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}
@media (max-width:860px){.start-grid{grid-template-columns:minmax(0,1fr)}}
.start-lead{font-size:1.05rem;max-width:56ch;margin:0;color:var(--muted)}
.pager[data-tone="blue"] button{background:#6F050D}
.s-red .btn.primary{background:#F7EDC4;border-color:#F7EDC4;color:#6F050D}
.s-light .btn.dark{background:#2B0A0C;border-color:#2B0A0C;color:#F7EDC4}

.pager{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:8px}
.pager button{all:unset;cursor:pointer;width:5px;height:16px;border-radius:2px;background:var(--ink);opacity:.3;transition:height .45s cubic-bezier(.65,0,.25,1.2),opacity .3s,background .4s}
.pager button.on{height:42px;opacity:1}
.pager button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pager[data-tone="red"] button{background:#F7EDC4}
.pager[data-tone="light"] button{background:#6F050D}
@media (max-width:760px){.pager{display:none}}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center;min-height:min(78vh,760px);padding-block:10px 30px}
@media (max-width:860px){.home{grid-template-columns:minmax(0,1fr);min-height:0}}
.home-title{font-size:clamp(3rem,9vw,6.6rem);font-weight:500;line-height:.95;letter-spacing:-.02em;margin:6px 0 0}
.home-title em{font-style:italic;color:var(--accent);font-weight:500}
.line{display:block;overflow:hidden;padding-bottom:.1em}
.line>span{display:block;animation:rise 1.1s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
@keyframes rise{from{transform:translateY(115%) rotate(4deg)}}
.reveal{animation:fadeup .9s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
@keyframes fadeup{from{opacity:0;transform:translateY(26px)}}
.home .lead{font-size:1.05rem;color:var(--muted);max-width:44ch;margin:18px 0 0}
.home-points{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;max-width:440px}
.home-points li{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.home-points b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.35rem;color:var(--accent);min-width:2ch}
.home-cta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:26px}
.btn.big{padding:15px 30px;font-size:1rem;letter-spacing:.04em}
.btn.big .arr{display:inline-block;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.btn.big:hover .arr{transform:translateX(5px)}
.home-art{position:relative;aspect-ratio:1/1;width:100%;max-width:520px;justify-self:center}
.home-art .px{position:absolute;transition:transform .9s cubic-bezier(.16,1,.3,1)}
.morph{position:absolute;inset:12%;background:radial-gradient(circle at 30% 25%,var(--k1),var(--k1b) 70%);display:grid;place-items:center;
  animation:morph 9s ease-in-out infinite,fadeup 1.2s cubic-bezier(.16,1,.3,1) .35s both;box-shadow:0 40px 80px -40px rgba(60,0,10,.6)}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%}25%{border-radius:58% 42% 38% 62% / 56% 38% 62% 44%}50%{border-radius:50% 50% 34% 66% / 62% 58% 42% 38%}75%{border-radius:36% 64% 56% 44% / 44% 62% 38% 56%}}
.morph .kanri{width:62%;margin-top:6%}
.ring{position:absolute;inset:4%;border:1.5px solid var(--k2);border-radius:50%;animation:spin 40s linear infinite,fadeup 1.2s .5s both}
@keyframes spin{to{transform:rotate(360deg)}}
.fc{border-radius:18px;padding:12px 16px;box-shadow:0 18px 30px -18px rgba(40,0,10,.45);font-size:.82rem;font-weight:600;display:flex;flex-direction:column;gap:2px;animation:bob 6s ease-in-out infinite}
.fc span{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.35rem;line-height:1.1}
.fc.k2{background:var(--k2);color:var(--k2-ink)} .fc.k3{background:var(--k3);color:var(--k3-ink)} .fc.k4{background:var(--k4);color:var(--k4-ink)}
@keyframes bob{50%{transform:translateY(-10px)}}
.brand{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;border-radius:8px}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

.notice{background:var(--surface);border:1px solid var(--k2);padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:.9rem}

main{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--k1);border-color:var(--k1);color:var(--k1-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost-on{background:transparent;border-color:currentColor;color:inherit}
.btn.danger{color:var(--neg);border-color:var(--neg-line);background:transparent}
.btn.small{padding:6px 12px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:default;transform:none}

/* ---------- the stack ---------- */
.stack-zone{display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:grid;padding-top:36px;perspective:1200px}
.scard{grid-area:1/1;border-radius:24px;padding:22px 22px 20px;transform-origin:50% 0;
  transition:transform .55s var(--ease-drop),opacity .4s ease,filter .4s;box-shadow:0 22px 40px -22px rgba(20,12,50,.55);
  display:flex;flex-direction:column;gap:10px;min-width:0;min-height:230px;overflow-wrap:anywhere}
.scard.k1{background:linear-gradient(160deg,var(--k1),var(--k1b));color:var(--k1-ink)}
.scard.k2{background:linear-gradient(160deg,var(--k2),var(--k2b));color:var(--k2-ink)}
.scard.k3{background:linear-gradient(160deg,var(--k3),var(--k3b));color:var(--k3-ink)}
.scard.k4{background:linear-gradient(160deg,var(--k4),var(--k4b));color:var(--k4-ink)}

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* Kanri mascot (original character), drawn in SVG */
const mascot = cls => `<svg class="kanri ${cls}" viewBox="0 0 200 215" aria-hidden="true" focusable="false"><g class="k-body">
  <g class="k-sprout"><path d="M101 48 C100 36 100 28 102 19" stroke="#6F050D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M102 21 C112 6 132 7 138 15 C128 27 111 30 102 21Z" fill="#6F050D"/>

  <ellipse cx="122" cy="203" rx="15" ry="7.5" fill="#F7EDC4" stroke="#6F050D" stroke-width="4"/>
  <path d="M100 46 C148 46 178 94 177 140 C176 182 142 202 100 202 C58 202 24 182 23 140 C22 94 52 46 100 46Z" fill="#F7EDC4" stroke="#6F050D" stroke-width="4.5"/>

  <ellipse cx="60" cy="124" rx="12" ry="7" fill="#E7A39A" opacity=".75"/><ellipse cx="140" cy="124" rx="12" ry="7" fill="#E7A39A" opacity=".75"/>
  <g class="k-eyes"><ellipse cx="74" cy="104" rx="7.5" ry="9.5" fill="#2B0A0C"/><circle cx="76.5" cy="100.5" r="2.6" fill="#FFFFFF"/>
    <ellipse cx="126" cy="104" rx="7.5" ry="9.5" fill="#2B0A0C"/><circle cx="128.5" cy="100.5" r="2.6" fill="#FFFFFF"/></g>
  <path d="M91 121 Q100 130 109 121" stroke="#2B0A0C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g class="k-coin"><circle cx="100" cy="160" r="21" fill="#6F050D"/><circle cx="100" cy="160" r="15" fill="none" stroke="#F7EDC4" stroke-width="2"/>
    <text x="100" y="167.5" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="600" font-size="22" fill="#F7EDC4">k</text></g>
  <ellipse cx="77" cy="160" rx="10" ry="8" fill="#F7EDC4" stroke="#6F050D" stroke-width="4"/>
  <g class="k-arm-r"><ellipse cx="123" cy="160" rx="10" ry="8" fill="#F7EDC4" stroke="#6F050D" stroke-width="4"/></g>
</g></svg>`;
const DAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const DAYS_S = ["dim","lun","mar","mer","jeu","ven","sam"];
const MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MONTHS_S = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const EXP_CATS = ["Stock / marchandise","Transport / livraison","Loyer","Emballage","Publicité","Salaires","Frais de paiement","Électricité / internet","Autre"];
const KC = ["k1","k2","k3","k4"];

const S = { shops:{}, settings:{currency:"€"}, view:"home", mode:"loading", ready:false, enter:false,
  ai:{}, chat:{}, confirm:null, sample:null, notice:null, lastAdded:null };
let store = null;

/* ---------- dates & numbers ---------- */
const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const addDays = (d, k) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + k);
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const parseD = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, (m||1)-1, d||1); };
const dayDiff = (a, b) => Math.round((a - b) / 864e5);
const cur = () => S.settings.currency || "€";
const nf = new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 2});
const nf0 = new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 0});
const money = n => { n = Number(n) || 0; return (Math.abs(n) >= 1000 ? nf0 : nf).format(n) + " " + cur(); };
const short = n => { n = Number(n)||0; if (Math.abs(n) >= 1e6) return nf.format(+(n/1e6).toFixed(1)) + " M"; if (Math.abs(n) >= 1e4) return nf0.format(n/1e3) + " k"; return nf0.format(n); };
const uid = p => p + "-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const fmtDate = s => { const d = parseD(s); return d.getDate() + " " + MONTHS_S[d.getMonth()] + " " + d.getFullYear(); };
const pct = x => (x > 0 ? "+" : "") + nf0.format(Math.round(x * 100)) + " %";
const shopIds = () => Object.keys(S.shops).sort((a, b) => (S.shops[a].created||0) - (S.shops[b].created||0));
const shopColor = id => KC[Math.max(0, shopIds().indexOf(id)) % KC.length];

/* ---------- stats ---------- */
function entriesOf(ids) { const out = []; for (const id of ids) { const sh = S.shops[id]; if (sh) for (const e of sh.entries || []) out.push(e); } return out; }
function monthStats(es) {
  const now = today0(); const mk = iso(now).slice(0,7); const pk = iso(new Date(now.getFullYear(), now.getMonth()-1, 1)).slice(0,7);
  const r = {rev:0, exp:0, ord:0, prevRev:0, prevExp:0, prevRevToDate:0}; const day = now.getDate();
  for (const e of es) {
    const k = String(e.d).slice(0,7);
    if (k === mk) { if (e.t === "vente") { r.rev += e.a; r.ord += e.o || 0; } else r.exp += e.a; }
    else if (k === pk) { if (e.t === "vente") { r.prevRev += e.a; if (parseD(e.d).getDate() <= day) r.prevRevToDate += e.a; } else r.prevExp += e.a; }
  }
  return r;
}
function weekly(es, n) {
  const now = today0(); const mon = addDays(now, -((now.getDay() + 6) % 7)); const first = addDays(mon, -7 * (n - 1));
  const b = Array.from({length:n}, (_, i) => ({start: addDays(first, 7*i), rev:0, exp:0, ord:0}));
  for (const e of es) { const i = Math.floor(dayDiff(parseD(e.d), first) / 7); if (i >= 0 && i < n) { if (e.t === "vente") { b[i].rev += e.a; b[i].ord += e.o||0; } else b[i].exp += e.a; } }
  return b;
}
function forecast(es) {
  const now = today0(); const start = addDays(now, -27);
  const sales = es.filter(e => e.t === "vente" && parseD(e.d) >= start && parseD(e.d) <= now);
  if (!sales.length) return null;
  const earliestAll = es.filter(e => e.t === "vente").reduce((m, e) => Math.min(m, parseD(e.d).getTime()), Infinity);
  const spanDays = Math.min(28, dayDiff(now, new Date(Math.max(earliestAll, start.getTime()))) + 1);
  const weeks = Math.max(1, spanDays / 7);
  const dow = Array.from({length:7}, () => ({a:0, o:0}));
  for (const e of sales) { const d = parseD(e.d).getDay(); dow[d].a += e.a; dow[d].o += e.o || 0; }
  dow.forEach(x => { x.a /= weeks; x.o /= weeks; });
  const amount = dow.reduce((s, x) => s + x.a, 0), orders = dow.reduce((s, x) => s + x.o, 0);
  const best = dow.map((x, i) => ({i, a:x.a})).sort((p, q) => q.a - p.a).filter(x => x.a > 0).slice(0, 2).map(x => x.i);
  const r14 = sales.filter(e => parseD(e.d) > addDays(now, -14)).reduce((s, e) => s + e.a, 0);
  const p14 = sales.filter(e => parseD(e.d) <= addDays(now, -14)).reduce((s, e) => s + e.a, 0);
  const trend = spanDays >= 21 && p14 > 0 ? (r14 - p14) / p14 : null;
  return {amount, orders, dow, best, trend, spanDays};
}

/* ---------- storage ---------- */
const queues = {};
function save(id, obj) {
  if (obj) S.shops[id] = obj; else delete S.shops[id];
  renderData();
  queues[id] = (queues[id] || Promise.resolve()).then(() => obj ? store.put(id, obj) : store.del(id)).catch(err => {
    const code = err && err.code;
    setNotice(code === "quota_exceeded" ? "Ton espace de stockage est plein. Supprime d'anciennes lignes ou la boutique d'exemple." :
      "L'enregistrement n'a pas marché (" + esc(code || "erreur") + "). Vérifie ta connexion puis recommence.");
  });
}
function setNotice(t) { S.notice = t; const n = $("#notice"); n.hidden = !t; n.innerHTML = t || ""; }
const LS = "mesboutiques.v1";
function localStore() {
  let data = {shops:{}, settings:{}};
  try { data = JSON.parse(localStorage.getItem(LS)) || data; } catch (e) {}
  S.shops = data.shops || {}; S.settings = {...S.settings, ...(data.settings || {})};
  const persist = () => { try { localStorage.setItem(LS, JSON.stringify({shops:S.shops, settings:S.settings})); } catch (e) { return Promise.reject({code:"local"}); } return Promise.resolve(); };
  return { put: persist, del: persist, putSettings: persist };
}
async function init() {
  let db = null, id = null, sample = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { const [d, u, s] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("sample")]); db = d; sample = s; id = u ? await u.id() : null; } catch (e) {}
  }
  S.sample = sample;
  if (db && id) {
    S.mode = "cloud";
    const col = db.collection("data/users/" + id);
    let loaded = false;
    const t = setTimeout(() => { if (!loaded) setNotice("Tes données ne sont pas encore joignables. Elles apparaîtront dès que la connexion revient."); }, 10000);
    col.onSnapshot(snap => {
      const shops = {};
      for (const d of snap.docs) { const v = d.data(); if (d.id === "settings") S.settings = {...S.settings, ...v}; else if (v && v.kind === "shop") shops[d.id] = {...v, entries: (v.entries || []).map(e => ({...e}))}; }
      S.shops = shops;
      if (!snap.metadata.fromCache) { loaded = true; clearTimeout(t); if (S.notice && S.notice.startsWith("Tes données")) setNotice(null); }
      const first = !S.ready; S.ready = true;
      if (!["overview","home","new"].includes(S.view) && !S.shops[S.view]) { S.view = "overview"; buildView(); }
      else if (first) buildView();
      renderData();
      if (loaded) purgeExamples();

function sbStore(sb) {
  const uidv = () => S.user.id;
  const chunks = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
  const ok = r => { if (r.error) throw {code: r.error.code || "db", message: r.error.message}; return r; };

      const del = [...old].filter(x => !now.has(x));
      for (const c of chunks(add, 500)) ok(await sb.from("entries").insert(c));
      for (const c of chunks(del, 200)) ok(await sb.from("entries").delete().in("id", c));

    async del(id) { ok(await sb.from("shops").delete().eq("id", id)); delete synced[id]; },

/* ---------- the stack engine ---------- */
const stacks = {};
function mountStack(key, el, cards, opts = {}) {
  if (!el) return;
  const sig = cards.map(c => c.cls + c.html).join("§");
  if (el.dataset.sig === sig && el.firstChild) return;
  const prev = stacks[key]; if (prev) clearInterval(prev.timer);
  el.dataset.sig = sig;
  const n = cards.length;
  const st = stacks[key] = {idx: prev && prev.idx < n ? prev.idx : 0, n, el, timer: null, paused: false};
  el.innerHTML = `<div class="stack">${cards.map((c, i) => `<article class="scard ${c.cls}" data-i="${i}">${c.html}</article>`).join("")}</div>` +
    (n > 1 ? `<div class="stack-ctl"><button class="sbtn" type="button" data-s="-1" aria-label="Carte précédente">‹</button><div class="dots">${cards.map(() => "<i></i>").join("")}</div><button class="sbtn" type="button" data-s="1" aria-label="Carte suivante">›</button></div>` : "");
  layout(st, !prev || opts.replay);
  el.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => { st.paused = true; step(st, +b.dataset.s); }));
  const stackEl = el.querySelector(".stack");
  stackEl.addEventListener("click", e => { if (n > 1 && !e.target.closest("button,a,input")) { st.paused = true; step(st, 1); } });
  if (opts.auto && n > 1 && !reduced) {
    st.timer = setInterval(() => { if (!st.paused && document.visibilityState === "visible" && document.body.contains(el)) step(st, 1); }, opts.auto);
    el.addEventListener("mouseenter", () => st.paused = true);
    el.addEventListener("mouseleave", () => st.paused = false);
  }
}

function layout(st, entering) {
  const cards = st.el.querySelectorAll(".scard");
  cards.forEach(c => {
    const d = (+c.dataset.i - st.idx + st.n) % st.n; const p = posOf(d);
    c.style.zIndex = String(st.n - d); c.style.transform = p.t; c.style.opacity = p.o; c.style.filter = p.f;

        {duration: 700, delay: (Math.min(st.n, 3) - 1 - d) * 260, easing: "cubic-bezier(.2,.9,.25,1.12)", fill: "backwards"});
    }
  });
  st.el.querySelectorAll(".dots i").forEach((dt, i) => dt.classList.toggle("on", i === st.idx));
}
function step(st, dir) {
  if (st.n < 2 || st.busy) return;
  const cards = [...st.el.querySelectorAll(".scard")];
  const top = cards.find(c => +c.dataset.i === st.idx);
  st.idx = (st.idx + dir + st.n) % st.n;
  if (reduced) { layout(st); return; }
  st.busy = true;
  if (dir > 0) {
    const from = top.style.transform;
    layout(st);
    const back = posOf((+top.dataset.i - st.idx + st.n) % st.n);
    top.animate([{offset: 0, transform: from, opacity: 1, zIndex: 99}, {offset: .32, transform: "translate(-46px,20px) rotate(-5deg) scale(.95)", opacity: 0, zIndex: 99}, {offset: .6, transform: back.t, opacity: 0, zIndex: 0}, {offset: 1, transform: back.t, opacity: back.o, zIndex: 0}],

/* ---------- full-screen sections revealed on scroll ---------- */
const pad2 = n => String(n).padStart(2, "0");
const sec = (n, total, cls, inner, id) => `<section class="sec ${cls}" id="${id}"><div class="sec-big" aria-hidden="true">${pad2(n)}</div><div class="sec-in"><div class="sec-num">${pad2(n)} <span>/ ${pad2(total)}</span></div>${inner}</div></section>`;
const words = t => t.split(" ").map((w, i) => { const it = w.startsWith("*") && w.endsWith("*"); const c = esc(w.replace(/\*/g, "")); return `<span class="w"><span style="--i:${i}">${it ? `<em>${c}</em>` : c}</span></span>`; }).join(" ");
let secObs = null;
function setupSections() {
  if (secObs) secObs.disconnect();
  const m = $("#main"); const secs = [...m.querySelectorAll(".sec")].filter(s => !s.hidden);
  m.classList.toggle("paged", secs.length > 0);
  const pager = $("#pager");
  pager.innerHTML = secs.map((s, i) => `<button type="button" data-sec="${s.id}" aria-label="Aller à la section ${i + 1}"></button>`).join("");
  pager.hidden = secs.length < 2;
  if (reduced || !("IntersectionObserver" in window)) { secs.forEach(s => s.classList.add("in")); updatePager(); return; }
  secObs = new IntersectionObserver(list => list.forEach(en => {
    if (en.isIntersecting && !en.target.classList.contains("in")) { en.target.classList.add("in"); countUps(en.target); }
  }), {threshold: .18});
  const obs = secObs;
  setTimeout(() => { if (obs === secObs) secs.forEach(s => obs.observe(s)); }, transitioning ? 650 : 0);
  updatePager();
}
function updatePager() {
  const secs = [...document.querySelectorAll("#main .sec")].filter(s => !s.hidden); const pager = $("#pager");
  if (!secs.length) return;
  let act = 0; secs.forEach((s, i) => { if (s.getBoundingClientRect().top < innerHeight * .45) act = i; });
  pager.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === act));
  pager.dataset.tone = secs[act].classList.contains("s-red") ? "red" : secs[act].classList.contains("s-light") ? "light" : secs[act].classList.contains("s-blue") ? "blue" : "";
}
addEventListener("scroll", updatePager, {passive: true});

function kpiHtml(m, goal) {
  const net = m.rev - m.exp; const delta = m.prevRevToDate > 0 ? (m.rev - m.prevRevToDate) / m.prevRevToDate : null; const d = "";
  const tiles = [
    `<span class="label">Ventes ce mois</span><span class="v">${cnt(m.rev, "money")}</span><span class="d ${delta == null ? "muted" : delta >= 0 ? "up" : "down"}">${delta == null ? "Pas encore de comparaison" : esc(pct(delta)) + " vs le mois dernier à la même date"}</span>`,
    `<span class="label">Dépenses ce mois</span><span class="v">${cnt(m.exp, "money")}</span><span class="d muted">${m.rev > 0 ? esc(nf0.format(Math.round(m.exp / m.rev * 100))) + " % de tes ventes" : "&nbsp;"}</span>`,
    `<span class="label">Bénéfice ce mois</span><span class="v ${net < 0 ? "down" : ""}">${cnt(net, "money")}</span><span class="d muted">Ventes moins dépenses</span>`,
    goal > 0 ? `<span class="label">Objectif du mois</span><span class="v">${cnt(Math.round(m.rev / goal * 100), "pct")}</span><span class="d muted">${esc(money(goal))} visés</span>`

  return `<div class="kpis">${tiles.map((t, i) => `<div class="kpi ${d}" style="animation-delay:${.15 + i * .1}s">${t}</div>`).join("")}</div>`;
}

function chartSvg(weeks, fc) {
  const W = 680, H = 230, L = 50, R = 10, T = 14, B = 30;
  const cols = weeks.length + (fc ? 1 : 0);
  const maxV = Math.max(1, ...weeks.map(w => Math.max(w.rev, w.exp)), fc ? fc.amount : 0);
  const mag = Math.pow(10, Math.floor(Math.log10(maxV))); const stepV = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => maxV / s <= 4) || mag * 10;
  const top = Math.ceil(maxV / stepV) * stepV; const y = v => T + (H - T - B) * (1 - v / top);
  const cw = (W - L - R) / cols; const bw = Math.min(24, cw * 0.36);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += stepV) g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(short(v))}</text>`;
  weeks.forEach((w, i) => {
    const cx = L + cw * i + cw / 2; const dl = `style="transition-delay:${600 + i * 60}ms"`;
    g += `<rect class="bar" ${dl} x="${cx - bw - 1}" y="${y(w.rev)}" width="${bw}" height="${Math.max(0, y(0) - y(w.rev))}" rx="5" fill="var(--k1)"><title>Ventes : ${esc(money(w.rev))}</title></rect>`;
    g += `<rect class="bar" ${dl} x="${cx + 1}" y="${y(w.exp)}" width="${bw}" height="${Math.max(0, y(0) - y(w.exp))}" rx="5" fill="var(--exp)"><title>Dépenses : ${esc(money(w.exp))}</title></rect>`;
    if (i % (cols > 9 ? 2 : 1) === 0 || i === weeks.length - 1) g += `<text class="ax" x="${cx}" y="${H - 10}" text-anchor="middle">${w.start.getDate()} ${MONTHS_S[w.start.getMonth()]}</text>`;
  });
  if (fc) {
    const cx = L + cw * weeks.length + cw / 2;
    g += `<rect class="bar" style="transition-delay:${600 + weeks.length * 60}ms" x="${cx - bw/2}" y="${y(fc.amount)}" width="${bw}" height="${Math.max(0, y(0) - y(fc.amount))}" rx="5" fill="var(--accent-soft)" stroke="var(--k1)" stroke-width="1.5" stroke-dasharray="4 3"><title>Prévu sur 7 jours : ${esc(money(fc.amount))}</title></rect>`;
    g += `<text class="ax" x="${cx}" y="${H - 10}" text-anchor="middle" style="fill:var(--accent);font-weight:600">prévu</text>`;
  }
  g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventes et dépenses par semaine">${g}</svg>`;
}
const legend = fc => `<div class="legend"><span><i style="background:var(--k1)"></i>Ventes</span><span><i style="background:var(--exp)"></i>Dépenses</span>${fc ? `<span><i style="background:var(--accent-soft);outline:1.5px dashed var(--k1)"></i>Ventes prévues (7 jours)</span>` : ""}</div>`;

/* ---------- AI ---------- */
function scopeIds(scope) { return scope === "all" ? shopIds() : [scope]; }
function aiContext(scope) {
  const now = today0(); const lines = ["Date d'aujourd'hui : " + iso(now) + " (" + DAYS[now.getDay()] + "). Devise : " + cur() + "."];
  for (const id of scopeIds(scope)) {
    const sh = S.shops[id]; if (!sh) continue; const es = sh.entries || [];
    lines.push("\n### Boutique « " + sh.name + " »" + (sh.act ? " — vend : " + sh.act : "") + (sh.goal ? " — objectif mensuel : " + sh.goal + " " + cur() : ""));
    lines.push("Semaines (lundi de début : ventes / commandes / dépenses) :");
    for (const w of weekly(es, 12)) lines.push("- " + iso(w.start) + " : " + Math.round(w.rev) + " / " + w.ord + " / " + Math.round(w.exp));
    const fc = forecast(es);
    if (fc) lines.push("Moyenne par jour de semaine (ventes / commandes), sur " + fc.spanDays + " jours : " + [1,2,3,4,5,6,0].map(i => DAYS[i] + " " + Math.round(fc.dow[i].a) + " / " + fc.dow[i].o.toFixed(1)).join(", "));
    const cats = {}; for (const e of es) if (e.t === "depense" && parseD(e.d) >= addDays(now, -90)) cats[e.c || "Autre"] = (cats[e.c || "Autre"] || 0) + e.a;
    if (Object.keys(cats).length) lines.push("Dépenses des 90 derniers jours par catégorie : " + Object.entries(cats).sort((a, b) => b[1] - a[1]).map(([c, v]) => c + " " + Math.round(v)).join(", "));
    const m = monthStats(es); lines.push("Mois en cours : ventes " + Math.round(m.rev) + ", dépenses " + Math.round(m.exp) + ", commandes " + m.ord + ". Mois précédent : ventes " + Math.round(m.prevRev) + ", dépenses " + Math.round(m.prevExp) + ".");
    const last = es.slice(-25); if (last.length) { lines.push("Dernières lignes :"); for (const e of last) lines.push("- " + e.d + " " + e.t + " " + e.a + (e.t === "vente" ? " (" + e.o + " cmd)" : " [" + (e.c || "") + "]") + (e.n ? " — " + e.n : "")); }
  }
  return lines.join("\n").slice(0, 60000);
}
const ROLE = "Tu es un conseiller financier bienveillant pour une petite commerçante ou un petit commerçant. Tu parles un français simple et direct, tu tutoies, tu donnes des conseils concrets et chiffrés basés uniquement sur les données fournies. Si les données sont trop peu nombreuses, dis-le et reste prudent.";
const aiState = s => S.ai[s] || (S.ai[s] = {status:"idle"});
const chatState = s => S.chat[s] || (S.chat[s] = {turns:[], busy:false});
const errCopy = c => ({
  not_granted: "Tu n'as pas autorisé cette page à utiliser Claude. L'assistant reste désactivé pour cette visite.",
  sampling_disabled: "Claude n'est pas disponible sur ce compte.",
  rate_limited: "Trop de demandes pour l'instant. Réessaie dans quelques minutes.",
  session_expired: "Ta session a expiré. Reconnecte-toi à Claude puis recharge la page.",
  invalid_json: "La réponse de l'IA était mal formée. Clique encore sur « Analyser ».",
  refused: "L'IA n'a pas pu répondre à cette demande. Reformule ta question.",
})[c] || "L'IA n'a pas répondu (problème de connexion). Réessaie.";
const disabledFor = c => ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c);

async function runAnalysis(scope) {
  const st = aiState(scope); if (st.status === "loading" || !S.sample) return;
  const ctl = new AbortController(); st.ctl = ctl; st.status = "loading"; st.err = null; renderAi(scope);
  const prompt = ROLE + `

Voici les chiffres :
${aiContext(scope)}

Analyse-les et réponds UNIQUEMENT avec un objet JSON de cette forme :
{"resume": "1 phrase forte sur la situation",
 "prevision": {"commandes_7j": nombre, "montant_7j": nombre, "jours_forts": ["samedi"], "explication": "1 à 2 phrases"},
 "commandes": ["3 à 4 conseils courts (max 30 mots) pour anticiper les commandes : stock, jours, quantités"],
 "economies": ["3 à 4 conseils courts (max 30 mots) pour dépenser moins, avec catégories et montants"],
 "epargne": {"montant_mensuel": nombre, "explication": "pourquoi ce montant est raisonnable, 1 à 2 phrases"},
 "alertes": ["0 à 2 problèmes à surveiller"]}
Les montants sont des nombres en ${cur()}, sans symbole.`;
  try { st.data = await S.sample.json(prompt, {signal: ctl.signal}); st.status = "done"; st.at = new Date(); st.v = (st.v || 0) + 1; }
  catch (e) { st.status = e && e.code === "cancelled" ? (st.data ? "done" : "idle") : "error"; st.err = e && e.code; if (disabledFor(st.err)) S.sample = null; }
  renderAi(scope);
}
async function ask(scope, q) {
  const cs = chatState(scope); if (cs.busy || !S.sample || !q) return;
  cs.turns.push({role:"user", content:q}); cs.busy = true; cs.live = ""; renderAi(scope);
  const lead = scope === "start"
    ? {role:"user", content: "Tu es Kanri, un conseiller bienveillant qui aide une personne à créer et lancer sa petite boutique (en ligne, sur les réseaux sociaux ou physique). Tu parles un français simple, tu tutoies, tu donnes des étapes concrètes, adaptées à un petit budget, avec des chiffres quand c'est utile. Devise : " + cur() + ". Réponds en 120 mots maximum. Les questions suivent."}
    : {role:"user", content: ROLE + " Réponds en 120 mots maximum, avec des chiffres quand c'est possible. Voici les chiffres :\n" + aiContext(scope) + "\n\nLes questions suivent."};
  try { const {text} = await S.sample([lead, ...cs.turns.slice(-8)], {cache:false, onText: ({text}) => { cs.live = text; renderChat(scope); }}); cs.turns.push({role:"assistant", content:text}); }
  catch (e) { const c = e && e.code; cs.turns.push({role:"assistant", content: (e && e.text ? e.text + "\n\n" : "") + "⚠ " + errCopy(c)}); if (disabledFor(c)) S.sample = null; }
  cs.busy = false; cs.live = ""; renderAi(scope);
}

function aiShell(scope) {
  return `<section class="ai-wrap" id="ai-${esc(scope)}" style="scroll-margin-top:16px">
    <div class="ai-intro"><div class="eyebrow">Assistant IA</div><h2 class="statement sm">${words("Tes chiffres, *transformés* en conseils.")}</h2>
      <p>L'IA lit tes ventes et tes dépenses, prévoit tes commandes des 7 prochains jours et te dit où économiser. Chaque conseil arrive sur une carte.</p>
      <div class="row"><button class="btn primary" type="button" data-ai="run">Analyser mes chiffres</button><button class="btn small" type="button" data-ai="stop" hidden>Arrêter</button></div>
      <p data-ai="msg" class="muted" style="margin:10px 0 0;font-size:.88rem"></p>
      <div class="chat"><span class="label muted">Ou pose ta question</span>
        <div class="chips">
          <button class="chip" type="button" data-q="Combien de stock dois-je acheter pour la semaine prochaine ?">Combien de stock acheter ?</button>
          <button class="chip" type="button" data-q="Quelle dépense je devrais réduire en premier, et de combien ?">Quelle dépense réduire ?</button>
          <button class="chip" type="button" data-q="Combien puis-je mettre de côté chaque mois sans gêner mon activité ?">Combien épargner ?</button>
        </div>
        <div class="chat-log" data-ai="log"></div>
        <form data-ai="ask"><input id="ask-${esc(scope)}" maxlength="500" placeholder="Ex. Est-ce que je dois augmenter mes prix ?" aria-label="Ta question"><button class="btn dark" type="submit">Envoyer</button></form>
      </div></div>
    <div data-ai="out" class="stack-zone"></div>
  </section>`;
}
function startShell() {
  return `<h2 class="statement">${words("Envie de *créer* ta boutique ?")}</h2>
  <p class="start-lead rv" style="--d:.45s">Lance-toi : donne un nom à ta boutique et elle rejoint ta pile tout de suite. Une question avant de commencer ? Kanri te répond.</p>
  <div class="start-grid">
    <form class="panel rv newshop" id="quick-shop" style="--d:.6s">
      <h3>Crée ta boutique en 30 secondes</h3>
      <div class="field"><label for="qs-name">Nom de la boutique</label><input id="qs-name" maxlength="60" placeholder="Ex. Douceurs d'Ama"></div>
      <div class="field"><label for="qs-act">Ce que tu vas vendre</label><input id="qs-act" maxlength="80" placeholder="Ex. pâtisseries, bijoux, pagnes"></div>
      <div class="field"><label for="qs-goal">Objectif de ventes par mois (facultatif)</label><input id="qs-goal" type="number" min="0" step="any" inputmode="decimal"></div>
      <button class="btn primary big" type="submit">Créer ma boutique <span class="arr">→</span></button>
    </form>
    <section class="panel rv" id="ai-start" style="--d:.75s">
      <h3>Pose-nous tes questions</h3>
      <p class="muted" style="margin:6px 0 12px">Idée, budget de départ, prix, organisation : Kanri t'aide à démarrer.</p>
      <div class="chips">
        <button class="chip" type="button" data-q="Quel type de boutique je peux ouvrir avec un petit budget ?">Quelle boutique ouvrir ?</button>
        <button class="chip" type="button" data-q="Combien d'argent faut-il pour commencer une petite boutique ?">Combien pour commencer ?</button>
        <button class="chip" type="button" data-q="Comment fixer mes prix pour faire du bénéfice ?">Comment fixer mes prix ?</button>
        <button class="chip" type="button" data-q="Comment trouver mes premiers clients ?">Trouver mes premiers clients</button>
      </div>
      <div class="chat"><div class="chat-log" data-ai="log"></div>
        <form data-ai="ask"><input id="ask-start" maxlength="500" placeholder="Ex. Je veux vendre des jus, par où commencer ?" aria-label="Ta question"><button class="btn dark" type="submit">Envoyer</button></form>
        <p data-ai="msg" class="muted" style="margin:0;font-size:.85rem"></p></div>
    </section>
  </div>
  <div class="sec-mascot" aria-hidden="true">${mascot("wave")}</div>`;
}
function bindAi(scope) {
  const root = document.getElementById("ai-" + scope); if (!root) return;
  root.querySelector('[data-ai="run"]')?.addEventListener("click", () => runAnalysis(scope));
  root.querySelector('[data-ai="stop"]')?.addEventListener("click", () => aiState(scope).ctl?.abort());
  root.querySelector('[data-ai="ask"]').addEventListener("submit", e => { e.preventDefault(); const i = e.target.querySelector("input"); const q = i.value.trim(); if (q) { i.value = ""; ask(scope, q); } });
  root.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => ask(scope, b.dataset.q)));
}
function aiCards(d) {
  const p = d.prevision || {}; const ep = d.epargne || {}; const cards = [];
  const arr = x => Array.isArray(x) ? x.filter(Boolean).map(String) : [];
  cards.push({cls:"k1", html:`<span class="tag">Prévision · 7 jours</span><div class="big">≈ ${esc(nf0.format(Number(p.commandes_7j) || 0))} commandes</div><div class="sub">Environ ${esc(money(Number(p.montant_7j) || 0))} de ventes${arr(p.jours_forts).length ? ". Jours forts : " + esc(arr(p.jours_forts).join(", ")) : ""}.</div>${p.explication ? `<div class="sub">${esc(p.explication)}</div>` : ""}${d.resume ? `<div class="foot"><span class="sub" style="font-style:italic">${esc(d.resume)}</span></div>` : ""}`});
  cards.push({cls:"k4", html:`<span class="tag">À mettre de côté</span><div class="big">${esc(money(Number(ep.montant_mensuel) || 0))}</div><div class="sub">par mois</div>${ep.explication ? `<div class="sub">${esc(ep.explication)}</div>` : ""}`});
  arr(d.commandes).forEach((t, i, a) => cards.push({cls:"k2", html:`<span class="tag">Anticiper les commandes · ${i + 1}/${a.length}</span><div class="quote">${esc(t)}</div>`}));
  arr(d.economies).forEach((t, i, a) => cards.push({cls:"k3", html:`<span class="tag">Économiser · ${i + 1}/${a.length}</span><div class="quote">${esc(t)}</div>`}));
  arr(d.alertes).forEach(t => cards.push({cls:"k4", html:`<span class="tag">À surveiller</span><div class="quote">${esc(t)}</div>`}));
  return cards;
}
function renderChat(scope) {
  const root = document.getElementById("ai-" + scope); if (!root) return; const cs = chatState(scope);
  const log = root.querySelector('[data-ai="log"]');
  const done = cs.turns.map((t, i) => `<div class="msg ${t.role === "user" ? "u" : "a"}" ${i < (cs.shown || 0) ? 'style="animation:none"' : ""}>${esc(t.content)}</div>`).join("");
  log.innerHTML = done + (cs.busy ? `<div class="msg a" style="animation:none">${cs.live ? esc(cs.live) : '<span class="dotp"></span>Réflexion…'}</div>` : "");
  cs.shown = cs.turns.length;
}
function renderAi(scope) {
  const root = document.getElementById("ai-" + scope); if (!root) return;
  const st = aiState(scope); const cs = chatState(scope);
  if (scope === "start") {
    root.querySelector('[data-ai="ask"] button').disabled = !S.sample || cs.busy;
    root.querySelectorAll("[data-q]").forEach(b => b.disabled = !S.sample || cs.busy);
    root.querySelector('[data-ai="msg"]').textContent = S.sample ? "" : "Les questions marchent quand Kanri est ouvert dans Claude, avec ton compte connecté.";
    renderChat(scope); return;
  }
  const hasData = scopeIds(scope).some(id => (S.shops[id]?.entries || []).length);
  root.querySelector('[data-ai="run"]').disabled = !S.sample || st.status === "loading" || !hasData;
  root.querySelector('[data-ai="stop"]').hidden = st.status !== "loading";
  root.querySelector('[data-ai="ask"] button').disabled = !S.sample || cs.busy || !hasData;
  root.querySelectorAll("[data-q]").forEach(b => b.disabled = !S.sample || cs.busy || !hasData);
  const msg = root.querySelector('[data-ai="msg"]');
  msg.className = st.status === "error" ? "down" : "muted";
  msg.textContent = !S.sample ? "L'assistant fonctionne quand la page est ouverte dans Claude, avec ton compte connecté. Tes boutiques et tes chiffres marchent sans lui."
    : !hasData ? "Ajoute quelques ventes et dépenses : l'assistant a besoin de chiffres pour te conseiller."
    : st.status === "error" ? errCopy(st.err)
    : st.status === "done" && st.at ? "Analyse faite à " + st.at.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"}) + ". Clique sur la pile pour passer à la carte suivante. Ce sont des estimations : garde ton bon sens." : "";
  const out = root.querySelector('[data-ai="out"]');
  if (st.status === "loading") { out.dataset.sig = ""; delete stacks["ai-" + scope]; out.innerHTML = `<div class="thinking-stack" aria-live="polite"><div></div><div></div><div>${mascot("think")}<span>Kanri étudie tes chiffres…</span></div></div>`; }
  else if (st.data) mountStack("ai-" + scope, out, aiCards(st.data), {replay: true});
  else if (out.dataset.sig !== "placeholder") {
    out.dataset.sig = "placeholder";
    out.innerHTML = `<div class="stack" aria-hidden="true" style="opacity:.55">
      <article class="scard k3" style="transform:translateY(-36px) scale(.88);z-index:1"></article>
      <article class="scard k2" style="transform:translateY(-18px) scale(.94);z-index:2"></article>
      <article class="scard k1 ai-ph" style="z-index:3;justify-content:center;align-items:center;text-align:center">${mascot("")}<div class="name">Tes conseils apparaîtront ici</div><div class="sub">Une carte par conseil</div></article></div>`;
  }
  renderChat(scope);
}

/* ---------- global events ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { e.preventDefault(); if (g.dataset.go !== S.view) go(g.dataset.go, e); return; }
  const sc = e.target.closest("[data-scroll]"); if (sc) { document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior: reduced ? "auto" : "smooth"}); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "logout") { if (S.sb) S.sb.auth.signOut(); }
    else if (act === "ask-del") { S.confirm = "shop"; renderShop(); }
    else if (act === "cancel") { S.confirm = null; renderShop(); }
    else if (act === "del-shop") { const id = S.view; delete S.ai[id]; delete S.chat[id]; S.view = "overview"; buildView(); save(id, null); }
    return;
  }
  const ps = e.target.closest("[data-sec]"); if (ps) { document.getElementById(ps.dataset.sec)?.scrollIntoView({behavior: reduced ? "auto" : "smooth"}); return; }
  const d = e.target.closest("[data-del]"); if (d) delEntry(S.view, d.dataset.del);
});
$("#currency").addEventListener("change", e => {
  S.settings = {...S.settings, currency: e.target.value};
  if (store) store.putSettings({...S.settings}).catch(() => setNotice("La devise n'a pas pu être enregistrée. Réessaie."));
  const l = $("#ef-a-l"); if (l) l.textContent = "Montant (" + cur() + ")";
  renderData();
});
$("#brand-mark").innerHTML = mascot("");
init();
})();
